<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Hershey Text</title>
  <style>
    /* Colours come from Figma's theme (figma.showUI themeColors: true) */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font: 11px/16px Inter, system-ui, -apple-system, sans-serif;
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
    }

    form { display: grid; gap: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    label { display: grid; gap: 4px; color: var(--figma-color-text-secondary); }

    input, select {
      width: 100%;
      height: 28px;
      padding: 0 8px;
      font: inherit;
      color: var(--figma-color-text);
      background: var(--figma-color-bg-secondary);
      border: 1px solid transparent;
      border-radius: 5px;
    }
    input:hover, select:hover { border-color: var(--figma-color-border); }
    input:focus, select:focus { outline: none; border-color: var(--figma-color-border-selected); }

    .hint { min-height: 16px; margin: 0; color: var(--figma-color-text-secondary); }
    .hint.warn { color: var(--figma-color-text-warning); }

    .buttons { display: flex; gap: 8px; justify-content: flex-end; }
    button {
      height: 32px;
      padding: 0 12px;
      font: inherit;
      font-weight: 500;
      border-radius: 5px;
      border: 1px solid var(--figma-color-border);
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
      cursor: pointer;
    }
    button[type="submit"] {
      border-color: transparent;
      color: var(--figma-color-text-onbrand);
      background: var(--figma-color-bg-brand);
    }
    button[type="submit"]:hover { background: var(--figma-color-bg-brand-hover); }
    button:disabled { opacity: 0.4; cursor: default; }
    button:focus-visible { outline: 2px solid var(--figma-color-border-selected); outline-offset: 1px; }
  </style>
</head>

<body>
  <form id="form">
    <label>Font
      <select id="font"></select>
    </label>
    <div class="row">
      <label>Font size (px)
        <input id="fontSize" type="number" value="50" min="1" step="any" required>
      </label>
      <label>Line height (px)
        <input id="lineHeight" type="number" value="75" min="0" step="any" required>
      </label>
    </div>
    <div class="row">
      <label>Letter spacing (%)
        <input id="letterSpacing" type="number" value="0" step="any" required>
      </label>
      <label>Stroke width (px)
        <input id="lineWidth" type="number" value="2" min="0.1" step="any" required>
      </label>
    </div>
    <p id="hint" class="hint"></p>
    <div class="buttons">
      <button type="button" id="close">Close</button>
      <button type="submit" id="convert">Convert</button>
    </div>
  </form>

  <script>
    const $ = (id) => document.getElementById(id);
    const fields = ['fontSize', 'lineHeight', 'letterSpacing', 'lineWidth'];

    function send(pluginMessage) {
      parent.postMessage({ pluginMessage }, '*');
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'init') {
        $('font').replaceChildren(...msg.fonts.map((name) => new Option(name, name)));
        if (msg.fonts.includes(msg.font)) $('font').value = msg.font;
      }

      if (msg.type === 'selection') {
        if (msg.settings) {
          for (const key of ['fontSize', 'lineHeight', 'letterSpacing']) $(key).value = msg.settings[key];
        }
        $('convert').disabled = !msg.textSelected;
        $('hint').textContent = msg.textSelected ? 'Values taken from the selected text layer.' : 'Select a single text layer to convert.';
        $('hint').classList.toggle('warn', !msg.textSelected);
      }
    };

    $('form').onsubmit = (event) => {
      event.preventDefault();
      const values = Object.fromEntries(fields.map((key) => [key, parseFloat($(key).value)]));
      send({ type: 'convert', font: $('font').value, ...values });
    };

    $('close').onclick = () => send({ type: 'close' });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') send({ type: 'close' });
    });
  </script>
</body>

</html>
